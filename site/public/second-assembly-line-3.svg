<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker>
    <marker id="t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c2410c"/></marker>
  </defs>
  <rect width="1000" height="440" fill="#ffffff"/>
  <text x="500" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#111827">一条认知流水线：是一个环，不是一条线</text>
  <text x="500" y="72" text-anchor="middle" font-size="14" fill="#6b7280">橙色是只有人能通过的闸门；青色是机器承担的工序</text>

  <!-- 5 boxes -->
  <rect x="40" y="120" width="160" height="92" rx="9" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  <text x="120" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">1 洗菜</text>
  <text x="120" y="175" text-anchor="middle" font-size="12" fill="#0d9488">材料切开，标明</text>
  <text x="120" y="193" text-anchor="middle" font-size="12" fill="#0d9488">声明 · 实测 · 推断</text>

  <rect x="228" y="120" width="160" height="92" rx="9" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="308" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">人工审核闸门</text>
  <text x="308" y="175" text-anchor="middle" font-size="12" fill="#c2410c">人点头，才能入账</text>
  <text x="308" y="193" text-anchor="middle" font-size="12" fill="#c2410c">没出处的隔离</text>

  <rect x="416" y="120" width="160" height="92" rx="9" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  <text x="496" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">2 摆盘 + 3 找茬</text>
  <text x="496" y="175" text-anchor="middle" font-size="12" fill="#0d9488">互斥的解释</text>
  <text x="496" y="193" text-anchor="middle" font-size="12" fill="#0d9488">攻击最脆弱的前提</text>

  <rect x="604" y="120" width="160" height="92" rx="9" fill="#fff7ed" stroke="#fb923c" stroke-width="2.4"/>
  <text x="684" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">4 拍板</text>
  <text x="684" y="175" text-anchor="middle" font-size="12" fill="#c2410c">押哪一个、几分把握</text>
  <text x="684" y="193" text-anchor="middle" font-size="12" fill="#c2410c">写下判断卡，人签字</text>

  <rect x="792" y="120" width="168" height="92" rx="9" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  <text x="876" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">5 立账</text>
  <text x="876" y="175" text-anchor="middle" font-size="12" fill="#0d9488">记下依据与"错的信号"</text>
  <text x="876" y="193" text-anchor="middle" font-size="12" fill="#0d9488">回答一律附证据</text>

  <line x1="200" y1="166" x2="224" y2="166" stroke="#6b7280" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="388" y1="166" x2="412" y2="166" stroke="#6b7280" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="576" y1="166" x2="600" y2="166" stroke="#6b7280" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="764" y1="166" x2="788" y2="166" stroke="#6b7280" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- return loop -->
  <path d="M 876 214 L 876 300 L 120 300 L 120 218" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#t)"/>
  <rect x="330" y="282" width="340" height="36" rx="8" fill="#ffffff" stroke="#5eead4" stroke-width="1.3"/>
  <text x="500" y="305" text-anchor="middle" font-size="13" font-weight="600" fill="#0f766e">新材料进来，先去撞旧判断：哪些该重查</text>

  <!-- footer notes -->
  <text x="40" y="365" font-size="13" font-weight="700" fill="#111827">三条铁律</text>
  <text x="40" y="388" font-size="12.5" fill="#475569">没有依据，不入账 · 机器起草，人拍板 · 账本只增不改</text>
  <text x="40" y="418" font-size="12" fill="#9ca3af">图中"人工审核闸门"和"拍板"两格，机器没有写入权限。</text>
</svg>
